<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wheel Wi-Fi setup</title>
<style>body{font:16px system-ui;max-width:480px;margin:24px auto;padding:0 20px;background:#0b1020;color:#eef5ff}label{display:block;margin:16px 0}input,select,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;margin-top:6px}button{cursor:pointer}button:disabled{opacity:.55}#scanMessage,#connection{min-height:1.5em}small{color:#b7c4da}</style>
<h1>Wheel Wi-Fi</h1><p>Connect the wheel to your 2.4 GHz Wi-Fi.</p>
<button id="scanButton" type="button">Find networks</button><p id="scanMessage" role="status"></p>
<label>Available networks<select id="networks"><option value="">Scan or enter the network name below</option></select></label>
<form id="configForm"><label>Network name<input id="ssid" maxlength="32" required autocomplete="off"></label><label>Password<input id="password" type="password" minlength="8" maxlength="63" required autocomplete="new-password"></label><button id="connectButton">Connect</button></form>
<p id="connection" role="status"></p><button id="forgetButton" type="button">Forget saved network</button><p><small>Credentials stay on your paired devices. WPA2/WPA3 personal networks are supported; enter hidden network names manually.</small></p>
<script>
const token='{{TOKEN}}';
const byId=id=>document.getElementById(id);
const scanButton=byId('scanButton'),scanMessage=byId('scanMessage'),networks=byId('networks'),ssid=byId('ssid'),password=byId('password'),connection=byId('connection'),connectButton=byId('connectButton');
let requestId=Date.now()>>>0;
async function request(path,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),6000);try{const response=await fetch(path,{...options,headers:{'X-Service-Token':token,...options.headers},signal:controller.signal,cache:'no-store'});if(!response.ok)throw new Error(await response.text());return response;}finally{clearTimeout(timer)}}
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
scanButton.onclick=async()=>{scanButton.disabled=true;scanMessage.textContent='Searching…';networks.replaceChildren(new Option('Searching…',''));try{let data=await(await request('/scan?start=1')).json();for(let tries=0;data.state===1&&tries<30;tries++){await delay(500);data=await(await request('/scan')).json()}if(data.state===1)throw new Error('Search timed out. Try again.');if(data.state!==2)throw new Error(data.error||'Search failed. Try again.');networks.replaceChildren(new Option('Choose a network',''));for(const ap of data.networks){const name=ap.ssid||'(Hidden network)';const supported=[3,4,6,7].includes(ap.auth);const option=new Option(name+' · '+ap.rssi+' dBm'+(!supported?' · unsupported security':''),ap.ssid);option.disabled=!ap.ssid||!supported;networks.add(option)}scanMessage.textContent=data.networks.length?'Choose a network, then enter its password.':'No networks found. Rescan or enter the name manually.';}catch(error){scanMessage.textContent=error.message;networks.replaceChildren(new Option('Enter the network name manually',''));}finally{scanButton.disabled=false}};
networks.onchange=()=>{if(networks.value){ssid.value=networks.value;password.focus()}};
byId('configForm').onsubmit=async event=>{event.preventDefault();connectButton.disabled=true;try{const a=new TextEncoder().encode(ssid.value),b=new TextEncoder().encode(password.value);if(!a.length||a.length>32||b.length<8||b.length>63)throw new Error('Check network name and password lengths.');const data=new Uint8Array(2+a.length+b.length);data[0]=a.length;data[1]=b.length;data.set(a,2);data.set(b,2+a.length);connection.textContent=await(await request('/configure',{method:'POST',headers:{'X-Request-ID':String(++requestId)},body:data})).text();}catch(error){connection.textContent=error.message}finally{password.value='';connectButton.disabled=false}};
byId('forgetButton').onclick=async()=>{try{connection.textContent=await(await request('/forget',{method:'POST'})).text()}catch(error){connection.textContent=error.message}};
let polling=false;setInterval(async()=>{if(polling)return;polling=true;try{const data=await(await request('/status')).json();const labels={0:'Ready',1:'Connecting…',2:'Connected. You can return to the wheel.',3:'Connection failed. Check the password and try again.',4:'Connected, but settings could not be saved.'};connection.textContent=labels[data.state]||'Working…';}catch{}finally{polling=false}},2000);
</script></html>
